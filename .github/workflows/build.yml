name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # needed to create releases on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      # A v1.2.3 tag makes an official build: stamped with that version (the updater compares it
      # with the latest release tag) and with updates switched on. Other builds keep the version in
      # Drowsy.csproj and never update themselves.
      - name: Version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '' }
          "RELEASE_ARGS=$(if ($version) { "-p:Version=$version -p:OfficialBuild=true" })" >> $env:GITHUB_ENV

      # GitHub's Windows runners include the MSVC toolchain NativeAOT needs.
      - name: Publish (NativeAOT)
        run: dotnet publish src/Drowsy -c Release -p:PublishAot=true ${{ env.RELEASE_ARGS }} -o artifacts/aot

      - name: Zip
        shell: pwsh
        run: |
          # Debug symbols (~25 MB) aren't needed to run the app; keep them as a separate artifact.
          Get-ChildItem artifacts/aot -Exclude *.pdb | Compress-Archive -DestinationPath Drowsy-win-x64.zip
          # The updater refuses a download that doesn't match this.
          "$((Get-FileHash Drowsy-win-x64.zip -Algorithm SHA256).Hash.ToLower())  Drowsy-win-x64.zip" |
            Set-Content -NoNewline -Encoding ascii Drowsy-win-x64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Drowsy-win-x64
          path: |
            Drowsy-win-x64.zip
            Drowsy-win-x64.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Drowsy-symbols
          path: artifacts/aot/*.pdb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Drowsy-win-x64.zip
            Drowsy-win-x64.zip.sha256
          generate_release_notes: true
